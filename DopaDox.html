<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f8f7" />
    <title>Open DopaDox</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background: linear-gradient(160deg, #f4f8f7, #eef6f7 55%, #f4f8f7);
        color: #1e302d;
        font-family:
          "Plus Jakarta Sans", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }

      main {
        width: min(100%, 440px);
        padding: 36px;
        border: 1px solid #d9e7e3;
        border-radius: 24px;
        background: rgb(255 255 255 / 88%);
        box-shadow: 0 20px 60px -36px rgb(30 48 45 / 35%);
      }

      .brand {
        color: #347a68;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 8px;
        font-size: clamp(28px, 8vw, 36px);
        letter-spacing: -0.04em;
      }

      p {
        color: #657773;
        font-size: 14px;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        margin-top: 14px;
        border-radius: 14px;
        padding: 13px 18px;
        background: #347a68;
        color: white;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #65b89a;
        outline-offset: 3px;
      }

      code {
        border-radius: 5px;
        padding: 2px 5px;
        background: #eef5f3;
        color: #347a68;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">DopaDox</div>
      <h1>Opening your dashboard…</h1>
      <p id="status" role="status">
        Checking that the latest local build is ready.
      </p>
      <a id="open-app" href="./dist/index.html#dashboard" hidden>
        Open dashboard
      </a>
    </main>
    <script>
      const appUrl = new URL("./dist/index.html", window.location.href);
      appUrl.hash = window.location.hash || "#dashboard";

      fetch(appUrl, { method: "HEAD" })
        .then((response) => {
          if (!response.ok) {
            throw new Error(`The local build returned HTTP ${response.status}.`);
          }

          window.location.replace(appUrl.href);
        })
        .catch((error) => {
          document.querySelector("#status").textContent =
            `${error.message} In VS Code, open Terminal → New Terminal, run ` +
            "`npm run build`, then click Go Live on DopaDox.html again.";
          document.querySelector("#open-app").hidden = false;
        });
    </script>
  </body>
</html>
